<script>
const search = document.getElementById("photo-search");
const openButton = document.getElementById("open-search-results");

let matchedPhotos = [];
let searchGallery = null;

search.addEventListener("input", function () {
  const term = this.value.toLowerCase().trim();

  matchedPhotos = [];

  document.querySelectorAll(".photo-item").forEach(function (item) {
    const caption = item.dataset.caption.toLowerCase();

    if (term !== "" && caption.includes(term)) {
      const img = item.querySelector("img");

      if (img) {
        matchedPhotos.push({
          href: img.src,
          type: "image",
          description: img.alt
        });
      }
    }
  });

openButton.textContent =
  "View " + matchedPhotos.length + " matching photos";

openButton.disabled = matchedPhotos.length === 0;
});

openButton.addEventListener("click", function () {
  if (matchedPhotos.length === 0) return;

  if (searchGallery) {
    searchGallery.destroy();
  }

  searchGallery = GLightbox({
    elements: matchedPhotos,
    loop: true
  });

  searchGallery.open();
});
</script>

<script id="quarto-html-after-body" type="application/javascript">
  window.document.addEventListener("DOMContentLoaded", function (event) {
    const isCodeAnnotation = (el) => {
      for (const clz of el.classList) {
        if (clz.startsWith('code-annotation-')) {                     
          return true;
        }
      }
      return false;
    }
    const onCopySuccess = function(e) {
      // button target
      const button = e.trigger;
      // don't keep focus
      button.blur();
      // flash "checked"
      button.classList.add('code-copy-button-checked');
      var currentTitle = button.getAttribute("title");
      button.setAttribute("title", "Copied!");
      let tooltip;
      if (window.bootstrap) {
        button.setAttribute("data-bs-toggle", "tooltip");
        button.setAttribute("data-bs-placement", "left");
        button.setAttribute("data-bs-title", "Copied!");
        tooltip = new bootstrap.Tooltip(button, 
          { trigger: "manual", 
            customClass: "code-copy-button-tooltip",
            offset: [0, -8]});
        tooltip.show();    
      }
      setTimeout(function() {
        if (tooltip) {
          tooltip.hide();
          button.removeAttribute("data-bs-title");
          button.removeAttribute("data-bs-toggle");
          button.removeAttribute("data-bs-placement");
        }
        button.setAttribute("title", currentTitle);
        button.classList.remove('code-copy-button-checked');
